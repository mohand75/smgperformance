# ============================================================
#  Cloudflare Worker configuration — SMG Performance Labs
#
#  Kept in the repo on purpose: the KV binding and asset settings are
#  applied on every deploy, so nobody has to re-enter them in dashboard
#  forms (and a wrong form entry can't silently break the store).
#
#  Secrets are NOT here and must never be. Add these in the dashboard
#  under Settings -> Variables and Secrets, as type Secret:
#    ADMIN_PASSWORD, RECOVERY_CODE,
#    SQUARE_ACCESS_TOKEN, SQUARE_LOCATION_ID, SQUARE_ENV
# ============================================================

name = "smgperformance"
main = "worker.js"
compatibility_date = "2024-11-01"

[assets]
directory = "."
binding = "ASSETS"

# Non-sensitive Square settings. These live here rather than in the dashboard
# because `wrangler deploy` makes the Worker match this file exactly — a
# plain-text variable added in the dashboard is wiped on the next deploy.
# Secrets are stored separately and are NOT affected.
[vars]
SQUARE_ENV = "production"
SQUARE_LOCATION_ID = "LEK2FK4R9VPPY"

# The catalogue, admin credentials and Square settings live here.
# This is the "smg-catalog" namespace under Storage & Databases -> KV.
[[kv_namespaces]]
binding = "SMG_KV"
id = "768665ffab494317ab6c4d04215d558f"
